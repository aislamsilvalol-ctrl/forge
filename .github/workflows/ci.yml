name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # versão vem do "packageManager" no package.json — declarar aqui
      # também faz a action abortar por ambiguidade
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # depois do build: os pacotes importam uns aos outros por dist/
      - name: Test
        run: pnpm test

      - name: Audit dependencies
        run: pnpm audit --audit-level high
        continue-on-error: true
